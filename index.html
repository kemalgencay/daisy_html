<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>daisyUI in Plain HTML</title>

    <!-- 1. Include daisyUI CSS -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@latest/dist/full.css" rel="stylesheet" type="text/css" />

    <!-- 2. Include Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-8 bg-base-200 min-h-screen flex flex-col items-center justify-center gap-4">

    <h1 class="text-3xl font-bold text-primary">Hello, daisyUI!</h1>

    <!-- Component Examples -->
    <button class="btn btn-primary">Primary Button Yeni</button>
    <button class="btn btn-secondary">Secondary Button</button>
    <button class="btn btn-accent">Accent Button</button>

    <!-- Card Component -->
    <div class="card w-96 bg-base-100 shadow-xl mt-4">
        <div class="card-body">
            <h2 class="card-title">Shoes!</h2>
            <p>If a dog chews shoes whose shoes does he choose?</p>
            <div class="card-actions justify-end">
                <button class="btn btn-primary">Buy Now</button>
            </div>
        </div>
    </div>

</body>
</html>
